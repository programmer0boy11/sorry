<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm So Sorry, My Love</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdf2f8, #fce7f3);
            color: #500724;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(159, 18, 57, 0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #fbcfe8;
        }

        .heart {
            font-size: 50px;
            color: #db2777;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: 26px;
            color: #9d174d;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #4b5563;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #db2777;
            color: white;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
        }

        #yesBtn:hover {
            background-color: #be185d;
        }

        #noBtn {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        .message-box {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 600;
            color: #be185d;
            min-height: 40px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>Please Forgive Me, My Love</h1>
        <p>I am so deeply sorry for not calling or texting you all day. You mean everything to me, and you are the most important person in my world. The silence today was agonizing because my favorite part of every single day is talking to you. Please forgive me?</p>
        
        <div class="buttons" id="buttonContainer">
            <button id="yesBtn" onclick="forgiveMe()">I Forgive You ❤️</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Still Mad</button>
        </div>

        <div class="message-box" id="responseMessage"></div>
    </div>

    <script>
        function forgiveMe() {
            const message = document.getElementById('responseMessage');
            message.innerHTML = "Thank you, my love. I promise I'll never let a whole day go by without hearing your voice again. I love you so much! 💖";
            document.getElementById('noBtn').style.display = 'none';
            document.getElementById('yesBtn').style.display = 'none';
        }

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.container');
            const maxX = container.clientWidth - noBtn.offsetWidth - 20;
            const maxY = 100;
            
            const x = (Math.random() - 0.5) * maxX;
            const y = (Math.random() - 0.5) * maxY;
            
            noBtn.style.position = 'relative';
            noBtn.style.transform = `translate(${x}px, ${y}px)`;

            const messages = [
                "Nice try, but you can't stay mad at me! 🥺",
                "You are too important to me to say no! 💕",
                "Come on, hit the pink button!",
                "You're stuck with my endless love instead! 🌹"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('responseMessage').innerHTML = randomMsg;
        }
    </script>
</body>
</html>
